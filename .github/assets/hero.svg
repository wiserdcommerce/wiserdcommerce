<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="WISERD — Independent commerce, settled cleanly.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0C0F14" />
      <stop offset="55%" stop-color="#111622" />
      <stop offset="100%" stop-color="#0B0E14" />
    </linearGradient>
    <radialGradient id="cobaltGlow" cx="82%" cy="18%" r="48%">
      <stop offset="0%" stop-color="#315FC8" stop-opacity="0.34" />
      <stop offset="60%" stop-color="#315FC8" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#315FC8" stop-opacity="0" />
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#FFFFFF" stroke-opacity="0.035" stroke-width="1" />
    </pattern>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="319" rx="16" fill="url(#bg)" stroke="#1F2937" />
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="url(#grid)" />
  <rect x="1" y="1" width="1198" height="318" rx="15" fill="url(#cobaltGlow)" />

  <!-- Top editorial status bar -->
  <g transform="translate(56, 44)">
    <circle cx="6" cy="6" r="4.5" fill="#315FC8" />
    <text x="20" y="10" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12" letter-spacing="1.6">WISERD MARKETPLACE · NEXT.JS 16 · SUPABASE POSTGRES · EVM</text>
  </g>

  <!-- WISERD geometric arc mark -->
  <g transform="translate(56, 108)" fill="none" stroke-linecap="round">
    <path d="M 8 56 A 40 40 0 0 1 88 56" stroke="#315FC8" stroke-width="5.5" />
    <path d="M 20 56 A 28 28 0 0 1 76 56" stroke="#93B4FF" stroke-width="5" />
    <path d="M 32 56 A 16 16 0 0 1 64 56" stroke="#F8FAFC" stroke-width="4.5" />
    <circle cx="48" cy="56" r="4.5" fill="#F8FAFC" />
  </g>

  <!-- Main Wordmark & Tagline -->
  <text x="170" y="156" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="64" font-weight="700" letter-spacing="4">WISERD</text>
  <text x="172" y="196" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, Helvetica, Arial, sans-serif" font-size="21" font-weight="400">Independent commerce, settled cleanly.</text>

  <!-- Right-side architectural spec card -->
  <g transform="translate(796, 86)">
    <rect width="348" height="148" rx="12" fill="#0B0E14" fill-opacity="0.72" stroke="#1E293B" />
    <text x="22" y="34" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">ARCHITECTURE PRINCIPLES</text>
    <line x1="22" y1="48" x2="326" y2="48" stroke="#1E293B" />
    <text x="22" y="74" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5">01  Google Identity != EVM Wallet</text>
    <text x="22" y="100" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5">02  Escrow-Backed Order Lifecycle</text>
    <text x="22" y="126" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="13.5">03  Private Global Seller Payouts</text>
  </g>

  <!-- Bottom hairline & pillars -->
  <line x1="56" y1="262" x2="1144" y2="262" stroke="#1E293B" />
  <text x="56" y="290" fill="#94A3B8" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1">PHYSICAL · DIGITAL · GAMING · SERVICES</text>
  <text x="1144" y="290" text-anchor="end" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="1.1">wiserdcommerce.netlify.app</text>
</svg>
