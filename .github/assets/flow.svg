<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 200" width="1200" height="200" role="img" aria-label="Sign in → List or Buy → Escrow Hold → Deliver &amp; Verify → Settle Payout">
  <defs>
    <linearGradient id="fbg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0C0F14" />
      <stop offset="100%" stop-color="#111622" />
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#315FC8" />
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="1199" height="199" rx="14" fill="url(#fbg)" stroke="#1F2937" />

  <!-- Step 1 -->
  <g transform="translate(32, 34)">
    <rect width="200" height="132" rx="10" fill="#131926" stroke="#243047" />
    <text x="18" y="30" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">01 · IDENTITY</text>
    <text x="18" y="64" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600">Sign In</text>
    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">Verified Google OAuth.</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">Optional EVM wallet.</text>
  </g>
  <line x1="236" y1="100" x2="262" y2="100" stroke="#315FC8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 2 -->
  <g transform="translate(266, 34)">
    <rect width="200" height="132" rx="10" fill="#131926" stroke="#243047" />
    <text x="18" y="30" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">02 · CATALOG</text>
    <text x="18" y="64" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600">List or Buy</text>
    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">Open a storefront or</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">order across 4 verticals.</text>
  </g>
  <line x1="470" y1="100" x2="496" y2="100" stroke="#315FC8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 3 -->
  <g transform="translate(500, 34)">
    <rect width="200" height="132" rx="10" fill="#152036" stroke="#315FC8" />
    <text x="18" y="30" fill="#93C5FD" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">03 · ESCROW</text>
    <text x="18" y="64" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600">Escrow Hold</text>
    <text x="18" y="90" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">Order enters auditable</text>
    <text x="18" y="108" fill="#CBD5E1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">escrow state timeline.</text>
  </g>
  <line x1="704" y1="100" x2="730" y2="100" stroke="#315FC8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 4 -->
  <g transform="translate(734, 34)">
    <rect width="200" height="132" rx="10" fill="#131926" stroke="#243047" />
    <text x="18" y="30" fill="#60A5FA" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">04 · FULFILL</text>
    <text x="18" y="64" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600">Deliver &amp; Verify</text>
    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">Realtime chat, delivery</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">proof &amp; dispute guard.</text>
  </g>
  <line x1="938" y1="100" x2="964" y2="100" stroke="#315FC8" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Step 5 -->
  <g transform="translate(968, 34)">
    <rect width="200" height="132" rx="10" fill="#131926" stroke="#243047" />
    <text x="18" y="30" fill="#34D399" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.4">05 · PAYOUT</text>
    <text x="18" y="64" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="17" font-weight="600">Release Funds</text>
    <text x="18" y="90" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">PayPal, Wise, Stripe,</text>
    <text x="18" y="108" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Inter, sans-serif" font-size="12.5">Payoneer or USDC/ETH.</text>
  </g>
</svg>
